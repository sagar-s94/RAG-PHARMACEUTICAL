{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragpharmacy|suppliers</title>
    <link rel="stylesheet" href="{%static 'supplier/suppliaredit.css'%}">
</head>
<body>
    <div id="Navbar">
        <img id="logo" src="{%static 'images/rag_logo.png'%}" alt="">
        <div class="welcomediv">
        <p id="welcome"> RAG</p>
        <p id="phr">PHARMACEUTICAL</p>
        </div>
        <div id="linkdiv">
            
            <a class="link" href="{%url 'stockqty'%}">Inventory</a>
            <a class="link" href="{%url 'placeorder'%}">Order</a>
           
            <a class="link" href="{%url 'medicinedetail' %}"> Medicine Detail</a>
            <a class="link" href="{%url 'supplierlist' %}">Supplier List</a>
        
        
            
        </div>
    </div>

    <div>
        <form method="POST">
            {%csrf_token%}
            <div>
                <label>Supplier Id</label>
                <input type="text" name="supplierid",placeholder="Automatic Genrate" >
            </div>
           
            <div>
                <label>Supplier Name</label>
                <input type="text" name="suppliername" placeholder="Enter supplier name" value="{{edit.suppliername}}" >
            </div>
            <div>
                <label>Company Name</label>
                <input type="text" name="companyname" placeholder="Enter company name" value="{{edit.companyname}}">

            </div>
            <div>
                <label>Contact Person</label>
                <input type="text" name="contactperson" placeholder="Enter contact person name" value="{{edit.contactperson}}">
            </div>
            <div>
                <label>Mobile</label>
                <input type="text" name="mobile" placeholder="Enter 10-digit mobile number" value="{{edit.mobile}}">
            </div>
            <div>
                <label>Email</label>
                <input type="text" name="email"  placeholder="Enter email address" value="{{edit.email}}">

            </div>
            <div>
                <label>GST NO</label>
                <input type="text" name="gstno" placeholder="Enter 15-character GST number" value="{{edit.gstno}}">
            </div>
            <div>
                <label>Drud Licence</label>
                <input type="text" name="druglicence" placeholder="Enter drug licence number" value="{{edit.druglicence}}">
            </div>
            <div>
                <label >Address</label>
                <input type="text" name="address"  placeholder="Enter complete address" value="{{edit.address}}">
            </div>
            <div>
                <label>City</label>
                <input type="text" name="city" placeholder="Enter city name" value="{{edit.city}}">
                
            </div>
            <div>
                <label>State</label>
                <input type="text" name="state"  placeholder="Enter state name" value="{{edit.state}}">

            </div>
            <div>
                  <label>Status</label>
    <select name="status">
        <option value="">-- Select Status --</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
    </select>
                
            </div>
            <button>Update Supplier</button>
        </form>
    </div>


    
</body>
</html>

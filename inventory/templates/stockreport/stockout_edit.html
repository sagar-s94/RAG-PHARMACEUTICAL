{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragphamacy|stockout|edit</title>
    <link rel="stylesheet" href="{%static 'stockout.edit.css' %}">
</head>
<body>
    <div id="Navbar">
        <img id="logo" src="{%static 'images/rag_logo.png'%}" alt="">
        <div class="welcomediv">
            <p id="welcome"> RAG</p>
            <p id="phr">PHARMACEUTICAL</p>
        </div>
        <div id="linkdiv">

            <a class="link" href="{%url 'stockqty'%}">Stock Qty</a>
            <a class="link" href="{%url 'stockin'%}">Stock In</a>
                 <a class="link" href="{%url 'update_stock' %}">Update Stockin</a>
            <a class="link" href="{%url 'stockout'%}">Stock Out</a>
           
           

        </div>
    </div>

    <div class="container">
        <div class="form-box">
            <h2>Today Stock Out</h2>

            <form method="POST">
                {% csrf_token %}





                <div class="form-group">
                    <label>Medicine ID</label>
                    <input type="text" name="medicineid" value="{{edit.medicineid}}" required>
                </div>

                <div class="form-group">
                    <label>Invoice Number</label>
                    <input type="text" name="invoice" value="{{edit.invoice}}" required>
                </div>

                <div class="form-group">
                    <label>Medicine Name</label>
                    <input type="text" name="medicinename" value="{{edit.medicinename}}" required>
                </div>

                <div class="form-group">
                    <label>Batch Number</label>
                    <input type="text" name="batchno" value="{{edit.batchno}}" required>
                </div>

                <div class="form-group">
                    <label>Current Stock</label>
                    <input type="number" name="currentstock" value="{{edit.currentstock}}" required>
                </div>

                <div class="form-group">
                    <label>Unit</label>
                    <select name="unit" required>
                        <option value="">Select Unit</option>
                        <option value="Tablet">Tablet</option>
                        <option value="Capsule">Capsule</option>
                        <option value="Syrup">Syrup</option>
                        <option value="Suspension">Suspension</option>
                        <option value="Injection">Injection</option>
                        <option value="Cream">Cream</option>
                        <option value="Ointment">Ointment</option>
                        <option value="Gel">Gel</option>
                        <option value="Lotion">Lotion</option>
                        <option value="Drops">Drops</option>
                        <option value="Spray">Spray</option>
                        <option value="Inhaler">Inhaler</option>
                        <option value="Powder">Powder</option>
                        <option value="Sachet">Sachet</option>
                        <option value="Granules">Granules</option>
                        <option value="Mouthwash">Mouthwash</option>
                        <option value="Gargle">Gargle</option>
                        <option value="Solution">Solution</option>
                        <option value="Emulsion">Emulsion</option>
                        <option value="Infusion">Infusion</option>
                        <option value="Patch">Patch</option>
                        <option value="Suppository">Suppository</option>
                        <option value="Shampoo">Shampoo</option>
                        <option value="Soap">Soap</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Unit Price (₹)</label>
                    <input type="text" name="unitprice" value="{{edit.unitprice}}" required>
                </div>

                <div class="form-group">
                    <label>Out Stock</label>
                    <input type="number" name="outstock" value="{{edit.outstock}}" required>
                </div>

                <div class="form-group">
                    <label> Date</label>
                    <input type="date" name="date" value="{{edit.date|date:'Y-m-d'}}" required>
                </div>

                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" name="customername" value="{{edit.customername}}" required>
                </div>

                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" name="expiredate" value="{{edit.expiredate|date:'Y-m-d'}}" required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status" required>
                        <option value="">Select Status</option>
                        <option value="In stock">In Stock</option>
                        <option value="Out of stock">Out of Stock</option>
                        <option value="Low Stock">Low Stock</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Last Update</label>
                    <input type="date" name="lastdate" value="{{edit.lastdate|date:'Y-m-d'}}" required>
                </div>

                <div class="form-group">
                    <label>Remark</label>
                    <textarea name="remark" rows="3" >{{ edit.remark }}></textarea>
                </div>

                <div class="form-group">
                    <button type="submit">Save Stock</button>
                </div>

            </form>
        </div>

    </div>

</body>
</html>
